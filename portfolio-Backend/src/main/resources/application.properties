#Application

server.port=${PORT:8080}
spring.application.name=portfolio-backend



# DATABASE - POSTGRESQL


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HIKARI CONNECTION POOL (OPTIMIZED FOR AIVEN CLOUD)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000



# JPA / HIBERNATE


spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# For development
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true



# JWT SECURITY


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==========================================
# INITIAL ADMIN
# ==========================================

admin.default.email=${ADMIN_EMAIL:}
admin.default.password=${ADMIN_PASSWORD:}
admin.default.name=${ADMIN_NAME:}


# ==========================================
# FILE UPLOAD
# ==========================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

file.upload-dir=${FILE_UPLOAD_DIR:uploads}



# CORS


cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}