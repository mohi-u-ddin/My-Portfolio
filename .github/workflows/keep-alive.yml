name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent backend from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions dashboard

jobs:
  keep-alive:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure Backend
        run: |
          echo "Pinging backend health endpoint to keep server warm..."
          response=$(curl -s -w "\nHTTP Status: %{http_code}\nTotal Time: %{time_total}s" --retry 2 --retry-delay 3 --max-time 45 "https://mohiuddingportfolio-backend-a7bvekdghfg2a3fg.centralindia-01.azurewebsites.net/api/health")
          echo "$response"
